<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — MJ & CO</title><link rel="icon" href="https://mj-and-co-testy-eating.vercel.app/logo.jpg"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="w"><a class="brand" href="index.html"><img src="https://mj-and-co-testy-eating.vercel.app/logo.jpg" alt="">MJ & CO Admin</a><small id="cnt"></small></div></header>
<main class="w"><div class="tabs"><button class="chip on" data-t="o">Orders</button><button class="chip" data-t="p">Products</button><button class="chip" data-t="s">Settings</button><button class="chip" data-t="m">Messages</button></div>
<section id="o"><select id="f" style="max-width:200px"><option value="">All statuses</option><option>pending</option><option>paid</option><option>preparing</option><option>delivered</option><option>cancelled</option></select><div id="ol" style="margin-top:14px"></div></section>
<section id="p" hidden><div class="box"><h3 id="pt">Add product</h3><input type="hidden" id="pk"><label>Name</label><input id="pn"><label>Category</label><input id="pc" list="cl" placeholder="Yogurt, Parfait, Granola, Flakes, Chops"><datalist id="cl"><option>Yogurt<option>Parfait<option>Granola<option>Flakes<option>Chops</datalist><label>Price (₦)</label><input id="pp" type="number"><label>Image file name (e.g. m3.jpg)</label><input id="pi"><label><input id="pa" type="checkbox" checked style="width:auto"> Available</label><div class="acts"><button class="btn" id="ps">Save product</button><button class="btn alt" id="pr">Clear</button></div></div><div class="grid" id="pl"></div></section>
<section id="s" hidden><div class="box"><h3>Payment & delivery settings</h3><label>Bank name</label><input id="sb"><label>Account number</label><input id="sa"><label>Account name</label><input id="sn"><label>Delivery fee (₦)</label><input id="sf" type="number"><button class="btn" id="ss" style="margin-top:12px">Save settings</button> <small id="sm"></small></div></section>
<section id="m" hidden><div id="ml"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="app.js"></script>
<script>
let O={},P={};getProducts().catch(()=>{});
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x==b));["o","p","s","m"].forEach(i=>$("#"+i).hidden=i!=b.dataset.t)});
db.ref("orders").orderByChild("createdAt").limitToLast(300).on("value",s=>{O=s.val()||{};drawO()});$("#f").onchange=drawO;
function drawO(){const f=$("#f").value,L=Object.entries(O).filter(([k,o])=>!f||o.status==f).reverse();$("#cnt").textContent=Object.keys(O).length+" orders";
$("#ol").innerHTML=L.map(([k,o])=>`<div class="box"><div class="row"><b>${esc(o.no)} · ${esc(o.ref)}</b><span class="tag ${o.status}">${o.status}</span></div><small>${new Date(o.createdAt).toLocaleString()}</small>
<p><b>${esc(o.name)}</b> · ${esc(o.phone)}<br>${esc(o.method)}${o.address?": "+esc(o.address):""}<br>Payment: ${esc(o.pay)} ${o.payClaimed&&o.status=="pending"?'<span class="tag pending">customer says paid</span>':""}</p>
<p>${(o.items||[]).map(i=>`${i.qty} × ${esc(i.name)}`).join(", ")}</p>${o.notes?`<p><small>Note: ${esc(o.notes)}</small></p>`:""}<div class="row tot"><span>Total</span><span>${N(o.total)}</span></div>
<div class="acts"><button class="btn g sm" onclick="act('${k}','paid')">Confirm payment</button><button class="btn sm" onclick="act('${k}','preparing')">Preparing</button><button class="btn sm" onclick="act('${k}','delivered')">Delivered</button><button class="btn alt sm" onclick="act('${k}','cancelled')">Cancel</button><a class="btn alt sm" target="_blank" href="https://wa.me/${o.phone}">Chat</a><button class="btn alt sm" onclick="del('${k}')">Delete</button></div></div>`).join("")||"<p>No orders yet.</p>"}
const MSG={paid:o=>`Hello ${o.name}, your payment for order ${o.no} (Ref: ${o.ref}) of ${N(o.total)} has been *confirmed* ✅. We are getting your order ready. Thank you for choosing MJ & CO!`,
preparing:o=>`Hello ${o.name}, your order ${o.no} is now being prepared 🍓.`,delivered:o=>`Hello ${o.name}, your order ${o.no} has been ${o.method=="Delivery"?"delivered":"handed over"}. Enjoy! Thank you for choosing MJ & CO 💖`,cancelled:o=>`Hello ${o.name}, your order ${o.no} has been cancelled. Please contact us if this is a mistake.`};
async function act(k,s){const o=O[k],w=window.open("","_blank");const u={status:s};if(s=="paid")u.paidAt=Date.now();await db.ref("orders/"+k).update(u);if(w)w.location=wa(o.phone,MSG[s](o))}
function del(k){if(confirm("Delete this order permanently?"))db.ref("orders/"+k).remove()}
db.ref("products").on("value",async s=>{P=s.exists()?s.val():await getProducts();
$("#pl").innerHTML=Object.entries(P).map(([k,p])=>`<div class="card"><div class="im"><img src="${esc(IMG(p.image))}" alt="" onerror="this.src=IMG('logo.jpg')"></div><div class="b"><b>${esc(p.name)}</b><small>${esc(p.category)} · ${p.available===false?"hidden":"available"}</small><span class="price">${N(p.price)}</span><div class="acts"><button class="btn sm" onclick="ed('${k}')">Edit</button><button class="btn alt sm" onclick="dp('${k}')">Delete</button></div></div></div>`).join("")});
function ed(k){const p=P[k];$("#pk").value=k;$("#pn").value=p.name;$("#pc").value=p.category;$("#pp").value=p.price;$("#pi").value=p.image;$("#pa").checked=p.available!==false;$("#pt").textContent="Edit product";scrollTo(0,0)}
function dp(k){if(confirm("Delete product?"))db.ref("products/"+k).remove()}
$("#pr").onclick=()=>{["pk","pn","pc","pp","pi"].forEach(i=>$("#"+i).value="");$("#pa").checked=true;$("#pt").textContent="Add product"};
$("#ps").onclick=async()=>{const o={name:$("#pn").value.trim(),category:$("#pc").value.trim(),price:+$("#pp").value,image:$("#pi").value.trim(),available:$("#pa").checked};if(!o.name||!o.category||!o.price)return alert("Name, category and price are required.");
const k=$("#pk").value;k?await db.ref("products/"+k).set(o):await db.ref("products").push(o);$("#pr").click()};
getSettings().then(s=>{$("#sb").value=s.bankName;$("#sa").value=s.accNo;$("#sn").value=s.accName;$("#sf").value=s.deliveryFee});
$("#ss").onclick=async()=>{await db.ref("settings").set({bankName:$("#sb").value.trim(),accNo:$("#sa").value.trim(),accName:$("#sn").value.trim(),deliveryFee:+$("#sf").value||0});$("#sm").textContent="Saved ✅"};
db.ref("messages").limitToLast(100).on("value",s=>{const L=Object.values(s.val()||{}).reverse();$("#ml").innerHTML=L.map(m=>`<div class="box"><b>${esc(m.name)}</b> · ${esc(m.contact)}<br><small>${new Date(m.at).toLocaleString()}</small><p>${esc(m.msg)}</p></div>`).join("")||"<p>No messages.</p>"});
</script></body></html>
